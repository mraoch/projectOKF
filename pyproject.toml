requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
